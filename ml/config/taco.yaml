# TACO dataset configuration for YOLOv8 fine-tuning
# Paths are relative to this file's location (ml/config/)
# data/processed/ lives two levels up from here

path: ../../data/processed
train: train/images
val: val/images
test: test/images

nc: 60

# Class names must match EXACTLY the keys in backend/app/data/recycling_rules.json
# and the values in frontend/src/constants/categories.ts (IDs 0–59)
